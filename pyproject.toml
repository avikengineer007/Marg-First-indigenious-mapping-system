[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marg"
version = "0.1.0"
description = "Marg — India-scoped self-hosted mapping and routing engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Avik Ghosh" }]
keywords = ["mapping", "routing", "osm", "india", "geocoding"]

dependencies = [
    # API framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # HTTP client (for OSRM/Nominatim backends)
    "httpx>=0.27.0",
    # Geospatial
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    # Rich terminal UI + CLI
    "rich>=13.7.1",
    "typer>=0.12.3",
    # Security middleware
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    # Data handling
    "aiofiles>=23.2.1",
    "orjson>=3.10.3",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",         # AsyncClient for FastAPI testing
    # Vulnerability scanning
    "pip-audit>=2.7.3",
    # Secrets scanning
    "detect-secrets>=1.4.0",
    # Pre-commit
    "pre-commit>=3.7.0",
    # Dependency pinning
    "pip-tools>=7.4.1",
]

[project.scripts]
marg = "marg.cli.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["marg*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["marg"]
omit = ["tests/*", "marg/web/*"]
