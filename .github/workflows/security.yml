name: Security Checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly scan every Monday 02:00 UTC to catch transitive vuln regressions
    - cron: "0 2 * * 1"

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit pip-tools

      - name: Generate pinned requirements
        run: pip-compile pyproject.toml --extra dev -o requirements.lock --quiet

      - name: Run pip-audit
        run: |
          pip-audit \
            --strict \
            --requirement requirements.lock \
            --format json \
            --output pip-audit-report.json
        # Non-zero exit on any HIGH/CRITICAL CVE fails the job

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  secrets-scan:
    name: Secrets Scan (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files '\.env\.example|tests/fixtures/.*'
        # Exits non-zero if new unaudited secrets are found vs the baseline
